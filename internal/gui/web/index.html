<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>极客时间下载器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='%23B23A2A'/%3E%3Crect x='5' y='5' width='22' height='22' rx='1.5' fill='none' stroke='%23F7F3EC' stroke-width='1.4'/%3E%3Cpath d='M16 9v10m0 0-4-4m4 4 4-4M10.5 23h11' stroke='%23F7F3EC' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // apply saved theme before first paint
  try { var t = JSON.parse(localStorage.getItem('gd.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="masthead">
  <div class="mast-inner">
    <a class="wordmark" href="#/explore" aria-label="极客时间下载器">
      <span class="seal" aria-hidden="true">极</span>
      <span class="wm-text">极客时间<span class="wm-sub">下载器</span></span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#/explore" data-nav="explore">全部课程</a>
      <a href="#/mine" data-nav="mine">我的课程</a>
      <a href="#/downloads" data-nav="downloads">下载<span class="nav-count" id="nav-badge" hidden>0</span></a>
      <a href="#/local" data-nav="local">本地</a>
      <a href="#/settings" data-nav="settings">设置</a>
    </nav>
    <div class="mast-tools">
      <button class="icon-btn" id="theme" type="button" title="切换深色 / 浅色" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="text-btn" id="logout" type="button" hidden>退出</button>
    </div>
  </div>
</header>
<main class="main" id="view" tabindex="-1"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
